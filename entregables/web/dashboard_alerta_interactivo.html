  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand i { font-size: 24px; color: #ef4444; }
    .brand h1 { font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
    .brand span { font-size: 13px; color: #94a3b8; margin-left: 8px; }
    .kpi-bar {
      display: flex;
      gap: 16px;
    }
    .kpi-pill {
      background: #334155;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .kpi-pill strong { color: #ffffff; }
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      position: relative;
    }
    #sidebar {
      width: 420px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 500;
    }
    .panel-section {
      padding: 18px 20px;
      border-bottom: 1px solid #334155;
    }
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #map {
      flex: 1;
      height: 100%;
      background: #0b1120;
    }
    .depto-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      background: #0f172a;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      align-items: center;
    }
    .badge-risk {
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    .badge-extremo { background: #991b1b; color: #fecaca; }
    .badge-alto { background: #c2410c; color: #ffedd5; }
    .badge-moderado { background: #854d0e; color: #fef08a; }
    .badge-bajo { background: #334155; color: #cbd5e1; }
    .hotspot-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hotspot-card:hover {
      border-color: #ef4444;
      background: #1e293b;
    }
    .hotspot-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .hotspot-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
      padding: 8px;
      font-family: 'Inter', sans-serif;
    }
    .leaflet-popup-tip { background: #1e293b; }
  </style>
