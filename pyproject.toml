[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incendios_py"
version = "0.1.0"
description = "Modelado predictivo y sistema de alerta temprana de incendios en Paraguay"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Martín Sánchez" }
]
license = { text = "MIT" }
dependencies = [
  "geopandas>=0.14.0",
  "shapely>=2.0.0",
  "rasterio>=1.3.0",
  "xarray>=2024.0.0",
  "rioxarray>=0.15.0",
  "polars>=1.0.0",
  "duckdb>=1.0.0",
  "pyarrow>=15.0.0",
  "pandas>=2.2.0",
  "tabulate>=0.9.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "lightgbm>=4.3.0",
  "scikit-learn>=1.4.0",
  "shap>=0.45.0",
  "joblib>=1.3.0",
  "matplotlib>=3.8.0",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
  "cdsapi>=0.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "black>=24.0.0",
  "flake8>=7.0.0"
]

[tool.setuptools]
packages = ["src"]
