name: CI - Verificación Científica e Integridad de Código

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Pruebas Unitarias y Validación GeoAI
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar Dependencias del Sistema (GDAL / Proj)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libgeos-dev

    - name: Instalar Dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Suite Exhaustivo de Pruebas Unitarias
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Configurar Quarto CLI
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Validar Compilación del Manuscrito Quarto
      run: |
        quarto render manuscrito.qmd --to html
